name: Live check of the Mexico station collector (one-off)
on:
  push:
    branches: [probe-mexico]
    paths: ['probe/run_mx.py', '.github/workflows/probe-mexico.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python probe/run_mx.py
      - name: Commit results to this branch
        if: always()
        run: |
          git config user.name "earth-feed bot"
          git config user.email "actions@github.com"
          git add probe/live
          git diff --staged --quiet || git commit -qm "live station check $(date -u +%FT%TZ)"
          git push
