name: Stage 8 source check (one-off)
on:
  push:
    branches: [probe-stage8]
    paths: ['probe/stage8.py', '.github/workflows/probe-stage8.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests xlrd
      - run: python probe/stage8.py
      - name: Commit results to this branch
        if: always()
        run: |
          git config user.name "earth-feed bot"
          git config user.email "actions@github.com"
          git add probe/src
          git diff --staged --quiet || git commit -qm "stage 8 source check $(date -u +%FT%TZ)"
          git push
